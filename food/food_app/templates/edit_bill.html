<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Bill</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    {% include 'nav.html' %}

    <div class="container mt-5">
        <h2 class="text-center">Edit Bill</h2>
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-3">
                    <label for="billNo" class="form-label">Bill No</label>
                    <input type="text" name="billNo" id="billNo" class="form-control" value="{{ bill.billNo }}" required>
                </div>
                <div class="col-md-3">
                    <label for="name" class="form-label">Customer Name</label>
                    <input type="text" name="name" id="name" class="form-control" value="{{ bill.name }}" required>
                </div>
                <div class="col-md-3">
                    <label for="phone" class="form-label">Contact No</label>
                    <input type="text" name="phone" id="phone" class="form-control" value="{{ bill.phone }}" >
                </div>
                <div class="col-md-3">
                    <label for="table" class="form-label">Table Name</label>
                    <input type="text" name="table" id="table" class="form-control" value="{{ bill.table }}" required>
                </div>
                <div class="col-md-3">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-control">
                        <option value="Pending" {% if bill.status == 'Pending' %}selected{% endif %}>Pending</option>
                        <option value="Paid" {% if bill.status == 'Paid' %}selected{% endif %}>Paid</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="amount" class="form-label">Total Amount</label>
                    <input type="text"  name="amount" id="amount" class="form-control" value="{{ bill.amount }}" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success mt-3">Update</button>
            <a href="{% url 'pending_bills' %}" class="btn btn-secondary mt-3">Cancel</a>
        </form>
    </div>
</body>
</html>
