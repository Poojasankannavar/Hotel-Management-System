{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="description" content="Hotel Template"><meta name="keywords" content="Hotel, unica, creative, html"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hotel</title>
    <link href="https://fonts.googleapis.com/css?family=Taviraj:300,400,500,600,700,800,900&display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}"><link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}"><link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body{font-family:'Open Sans',sans-serif;margin:0;padding:0}.hero-section{background-image:url("{% static 'img/bg.jpg' %}");background-size:cover;background-position:center;min-height:100vh;padding:60px 0}.navbar-brand img{height:40px;width:100px}.navbar-dark .navbar-nav .nav-link{color:white!important}.navbar-dark .navbar-nav .nav-link:hover,.navbar-dark .navbar-nav .nav-link.active{color:#ccc!important}.dropdown-menu{background-color:#343a40}.dropdown-menu .dropdown-item{color:white}.dropdown-menu .dropdown-item:hover{background-color:#495057;color:#fff}.button-container{display:flex;justify-content:center;flex-wrap:wrap;gap:15px;margin-bottom:30px}.btn{padding:12px 24px;font-size:14px;text-transform:uppercase;border-radius:50px;transition:all .3s ease-in-out;box-shadow:0 4px 10px rgba(0,0,0,.15)}.btn:hover{transform:scale(1.05);background-color:#218838!important}.table-card{background-color:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);padding:20px;border-radius:10px;cursor:pointer;transition:.3s ease;text-align:center;height:150px;display:flex;flex-direction:column;justify-content:center}.table-card:hover{transform:scale(1.05);box-shadow:0 8px 16px rgba(0,0,0,.2)}.selected{background-color:#28a745!important;color:white!important}.stored{background-color:#dc3545!important;color:white!important}@media(max-width:576px){.table-card{font-size:14px}}
    </style>
</head>
<body style="background-image:url('{% static 'img/table3.jpg' %}');background-size:cover;background-position:center;opacity:.9">
{% include 'navuser.html' %}
<div class="hero-section d-flex align-items-start"><div class="container">
  <div class="card bg-light text-center p-3 shadow-sm rounded-3" style="max-width:500px;margin:20px auto"><p class="text-success fw-bold mb-0 fs-5">Orders can be canceled within 10 minutes.</p></div>
  <br><br><div class="button-container"><a href="{% url 'userHome' %}" class="btn btn-success" id="userHome">TABLE ORDERING</a></div>
  <div class="row">{% for table in tdata %}<div class="col-md-2 col-sm-4 col-6 mb-4"><div class="table-card {% if table.Table_name == saved_table_name %}selected{% elif table.Table_name in stored_tables %}stored{% endif %}" onclick="selectTable('{{ table.Table_name }}')"><h5><strong>{{ table.Table_name }}</strong></h5><p>{{ table.Category }}</p></div></div>{% endfor %}</div>
</div></div>
<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script><script src="{% static 'js/bootstrap.min.js' %}"></script>
<script>document.addEventListener("keydown",function(event){if(event.ctrlKey){event.preventDefault();const actions={"s":"settleTable","p":"printBill","c":"checkTable","e":"exTable","d":"deleteTable"};const actionId=actions[event.key.toLowerCase()];if(actionId&&document.getElementById(actionId))document.getElementById(actionId).click()}});function selectTable(table_name){window.location.href="{% url 'add_order_user' %}?table="+encodeURIComponent(table_name)}</script>
</body></html>
