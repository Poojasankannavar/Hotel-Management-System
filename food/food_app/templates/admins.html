{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> DATA List</title>
</head>
<body>
{% include 'nav.html' %}

    <div class="container my-5">
        <h1 class="text-center text-primary mb-4">ADMINS LISTS</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="table-success">
                    <tr>
                        <th>User Name</th>
                        <th>Mobile Number</th>
                        <th>ADMIN Id</th>
                        <th>Password</th>
                        <th>Delete</th>
                        <th>Edit</th>
                    </tr>
                </thead>
                <tbody>
                    {% for product in products %}
                    <tr>
                        <td>{{ product.admin_name}}</td>
                        <td>{{ product.mobile_number}}</td>
                        <td>{{ product.admin_id}}</td>
                        <td>{{ product.password }}</td>
                        <td>
                            <a href="{% url 'delete_admins' product.id %}"  class="btn btn-danger"onclick="return confirm('Are you sure?')">Delete</a>
                        </td>
                        <td>
                            <a href="{% url 'edit_admin' product.id %}" class="btn btn-primary">Edit</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
