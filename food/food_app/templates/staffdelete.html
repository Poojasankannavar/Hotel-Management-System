    <style>
        .card-clickable {
            cursor: pointer;
            background-color: #dc3545 !important; /* Red for stored */
        color: white !important;
        box-shadow: 0 8px 16px rgba(220, 53, 69, 0.5); /* Red shadow when stored */
        transform: scale(1.05); /* Slightly scale up when stored */

        }

        .card-clickable:hover {
            transform: scale(1.02);
        }
        /* Make sure the navbar stays at the top and is not covered by the image */
    .header-section {
        position: absolute; /* Fixed or absolute to stay on top of the image */
        top: 0;
        left: 0;
        z-index: 1000; /* Ensure the navbar stays above other content */

        display: block;
    }

<body>
{% include 'nav.html' %}
<br/>
<br/>
<br/>
<br/>
<br/>

<div class="container mt-4">
    <h2>Delete Table</h2>
    <div class="row mt-4">
        {% for table in tableName %}
        <div class="col-md-4 mb-4">
            <div class="card card-clickable
                {% if table.table_name == saved_table_name %}bg-blue
                {% elif table.table_name in stored_tables %}bg-yellow
                {% endif %}"
                onclick="selectTable('{{ table.table_name }}')">
                <div class="card-body">
                    <h5 class="card-title"><strong>{{ table.table_name }}</strong></h5>
                    <button class="btn btn-danger delete-btn" onclick="deleteTable('{{ table.table_name }}')">Delete</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
<script>
    function deleteTable(table_name) {
        // Ask for confirmation before deleting
        if (confirm('Are you sure you want to delete this table?')) {
            // Make an AJAX call to Django to delete the table
            $.ajax({
                url: '{% url "staffdelete_table" %}',  // URL for the delete_table view
                method: 'POST',
                data: {
                    'table_name': table_name,
                    'csrfmiddlewaretoken': '{{ csrf_token }}',
                },
                success: function(response) {
                    alert('Table deleted successfully!');
                    // Redirect to the admin home page after successful deletion
                    window.location.href = '{% url "userHome" %}';  // Update 'admin_home' with your actual URL name
                },
                error: function(response) {
                    alert('Failed to delete table. Please try again.');
                }
            });
        }
    }
</script>


    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>


<!-- Js Plugins -->

    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/jquery-ui.min.js' %}"></script>
    <script src="{% static 'js/jquery.nice-select.min.js' %}"></script>
    <script src="{% static 'js/jquery.slicknav.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
