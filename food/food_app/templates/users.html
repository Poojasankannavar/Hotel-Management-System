{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> DATA List</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include 'nav.html' %}


   <br>
   <br>
   <br>

    <div class="container my-5">
        <h1 class="text-center text-primary mb-4">USERS LISTS</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="table-success">
                    <tr>
                        <th>User Name</th>
                        <th>Mobile Number</th>
                        <th>Password</th>
                        <th>Delete</th>
                        <th>Edit</th>
                    </tr>
                </thead>
                <tbody>
                    {% for product in products %}
                    <tr>
                        <td>{{ product.user_name }}</td>
                        <td>{{ product.mobil_number }}</td>
                        <td>{{ product.password }}</td>
                         <td>
                         <a href="{% url 'delete_users' product.id %}"  class="btn btn-danger"onclick="return confirm('Are you sure?')">Delete</a>
                         </td>
                        <td>
                        <a href="{% url 'edit_user' product.id %}" class="btn btn-primary" >Edit</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <!-- Optional Bootstrap JS (if needed for components) -->
        <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
