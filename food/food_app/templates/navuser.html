
{% load static %}
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-brown: #241610;
            --brown: #382319;
            --gold: #d6a756;
            --light-gold: #f1d59a;
            --cream: #fff8ec;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background: linear-gradient(120deg, var(--dark-brown), var(--brown));
            padding: 12px 4%;
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.18);
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border: 2px solid var(--gold);
            border-radius: 50%;
            background: var(--cream);
        }

        .brand-name {
            color: var(--white);
            font-family: 'Playfair Display', serif;
            font-size: 25px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-name span {
            color: var(--gold);
        }

        .navbar-nav {
            align-items: center;
            gap: 3px;
        }

        .navbar .nav-link {
            color: #f9eee0;
            font-size: 12px;
            font-weight: 600;
            padding: 11px 10px !important;
            border-radius: 6px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .navbar .nav-link:hover,
        .navbar .nav-link:focus,
        .navbar .nav-link.active {
            color: var(--gold);
            background: rgba(255, 255, 255, 0.07);
        }

        .navbar .nav-link i {
            color: var(--gold);
        }

        .navbar-toggler {
            border: 1px solid var(--gold);
            padding: 7px 10px;
        }

        .navbar-toggler:focus {
            box-shadow: 0 0 0 3px rgba(214, 167, 86, 0.25);
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        .dropdown-menu {
            background: var(--cream);
            border: 1px solid rgba(214, 167, 86, 0.5);
            border-radius: 10px;
            padding: 8px;
            min-width: 190px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.18);
        }

        .dropdown-item {
            color: var(--dark-brown);
            font-size: 13px;
            font-weight: 500;
            padding: 11px 12px;
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        .dropdown-item i {
            color: #9b6b26;
            width: 20px;
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            color: var(--dark-brown);
            background: #f0dfbf;
            transform: translateX(3px);
        }

        @media (max-width: 991.98px) {
            .navbar {
                padding: 10px 4%;
            }

            .navbar-collapse {
                padding-top: 14px;
                max-height: 75vh;
                overflow-y: auto;
            }

            .navbar-nav {
                align-items: stretch;
                gap: 3px;
            }

            .navbar .nav-link {
                padding: 11px 14px !important;
                font-size: 13px;
            }

            .dropdown-menu {
                margin: 4px 12px;
                box-shadow: none;
            }
        }

        @media (max-width: 420px) {
            .brand-logo {
                width: 40px;
                height: 40px;
            }

            .brand-name {
                font-size: 22px;
            }
        }
    </style>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand" href="{% url 'homepage' %}">
            <span class="brand-name">Heavenly</span>
        </a>

        <!-- Mobile Toggle -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'homepage' %}">
                        <i class="fas fa-house me-1"></i> HOME
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'hotelslist' %}">
                        <i class="fas fa-hotel me-1"></i> HOTELS LIST
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'homepage' %}#about">
                        ABOUT
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'homepage' %}#contact">
                        CONTACT
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'food_view' %}">
                        <i class="fas fa-utensils me-1"></i> FOOD MENU
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}">
                        <i class="fas fa-chair me-1"></i> TABLE ORDER
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'room_view' %}">
                        <i class="fas fa-bed me-1"></i> ROOM BOOKING
                    </a>
                </li>

                <!-- Login Dropdown -->
                <li class="nav-item dropdown">
                    <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        id="loginDropdown"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <i class="fas fa-sign-in-alt me-1"></i> LOGIN
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="loginDropdown">
                        <li>
                            <a class="dropdown-item" href="{% url 'adminlogin' %}">
                                <i class="fas fa-user-shield me-2"></i> Admin Login
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'userlogin' %}">
                                <i class="fas fa-user me-2"></i> User Login
                            </a>
                        </li>
                    </ul>
                </li>

                <!-- Register Dropdown -->
                <li class="nav-item dropdown">
                    <a
                        class="nav-link dropdown-toggle"
                        href="#"
                        id="registerDropdown"
                        role="button"
                        data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <i class="fas fa-user-plus me-1"></i> REGISTER
                    </a>

                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="registerDropdown">
                        <li>
                            <a class="dropdown-item" href="{% url 'adminregister' %}">
                                <i class="fas fa-user-shield me-2"></i> Admin Register
                            </a>
                        </li>
                        <li>
                            <a class="dropdown-item" href="{% url 'userregister' %}">
                                <i class="fas fa-user-plus me-2"></i> User Register
                            </a>
                        </li>
                    </ul>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
