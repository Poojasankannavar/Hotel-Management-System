{% load static %}
<!DOCTYPE html>
<html lang="zxx">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Hotel Template">
    <meta name="keywords" content="Hotel, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel</title>
    <link href="https://fonts.googleapis.com/css?family=Taviraj:300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .hero-section{background-image:url("{% static 'img/bg.jpg' %}");padding-bottom:5%;background-size:cover;background-position:center}
        .button-container{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;padding:20px 0}
        .btn{padding:15px 30px;font-size:16px;text-transform:uppercase;border-radius:5px}
        .table-card{background-color:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);padding:15px;border-radius:10px;cursor:pointer;transition:.3s ease;text-align:center;min-height:150px;display:flex;align-items:center;justify-content:center}
        .table-card:hover{transform:scale(1.05);box-shadow:0 8px 16px rgba(0,0,0,.2)}
        .selected{background-color:#28a745!important;box-shadow:0 8px 16px rgba(40,167,69,.5)}
        .stored{background-color:#dc3545!important;box-shadow:0 8px 16px rgba(220,53,69,.5)}
    </style>
</head>
<body style="background-image:url('{% static 'img/table3.jpg' %}');background-size:cover;background-position:center;opacity:.9">
<div id="preloder"><div class="loader"></div></div>

{% include 'nav.html' %}
<div class="hero-section"><div class="container"><div class="overlay-content">
  <div class="button-container">
    <a href="{% url 'exchange_tbl' %}" class="btn btn-success" id="exTable">Exc Tbl</a>
    <a href="{% url 'settle_table' %}" class="btn btn-success" id="settleTable">Settle Bill</a>
    <a href="{% url 'print_table' %}" class="btn btn-success" id="printBill">Print Bill</a>
    <a href="{% url 'checkTables' %}" class="btn btn-success" id="checkTable">Check Table</a>
  </div>
  <div class="row mt-4">
    {% for table in tdata %}<div class="col-md-2"><div class="card mb-4 table-card {% if table.Table_name == saved_table_name %}selected{% elif table.Table_name in stored_tables %}stored{% endif %}" onclick="selectTable('{{ table.Table_name }}')"><div class="card-body"><h5 class="card-title"><strong>{{ table.Table_name }}</strong></h5><p class="card-text">{{ table.Category }}</p></div></div></div>{% empty %}
    <div class="col-12"><div class="alert alert-warning text-center" role="status"><strong>No dining tables are configured yet.</strong><br>Add a table to enable table ordering and billing.<br><a class="btn btn-primary mt-3" href="{% url 'add_table' %}">Add the first table</a></div></div>
    {% endfor %}
  </div>
</div></div></div>
<script>
function selectTable(table_name){const selectedCard=document.querySelector('.selected');if(selectedCard)selectedCard.classList.remove('selected');const redirectUrl="{% url 'add_order' %}?table="+encodeURIComponent(table_name)+"&redirect=admin_home";window.location.href=redirectUrl}
document.addEventListener("keydown",function(event){if(event.ctrlKey){event.preventDefault();switch(event.key.toLowerCase()){case "s":document.getElementById("settleTable").click();break;case "p":document.getElementById("printBill").click();break;case "c":document.getElementById("checkTable").click();break;case "e":document.getElementById("exTable").click();break}}});
</script>
<script src="{% static 'js/jquery-3.3.1.min.js' %}"></script><script src="{% static 'js/bootstrap.min.js' %}"></script><script src="{% static 'js/main.js' %}"></script>
</body></html>
