{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Taviraj:400,600|Open+Sans:400,600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8f9fa;
            padding-top: 100px;
        }

        .form-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }

        h2 {
            font-family: 'Taviraj', serif;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .btn-success {
            width: 100%;
        }

        .alert {
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    {% include 'nav.html' %}

    <div class="container">
        <div class="form-container mt-5">
            <h2> ADD STAFF</h2>

            {% if msg %}
                <div class="alert alert-danger">{{ msg }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" name="t4" id="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="mobile" class="form-label">Mobile Number:</label>
                    <input type="text" name="t2" id="mobile" pattern="\d+" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" name="t1" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="utype" class="form-label">User Type:</label>
                    <select name="utype" id="utype" class="form-select">
                        <option value="admin">Admin</option>
                        <option value="staff">Staff</option>
                    </select>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success">ADD STAFF</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS -->
    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>
