<!DOCTYPE html>
<html>
<head>
    <title>Book Register List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
{% include 'nav.html' %}

<br>
<br>
<br>


<div class="container mt-5">
    <h2>All Book Registered Users</h2>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Password</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in records %}
            <tr>
                <td>{{ user.name }}</td>
                <td>{{ user.mobile }}</td>
                <td>{{ user.password }}</td>
                <td>
                    <a href="{% url 'bookregister_edit' user.id %}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="{% url 'bookregister_delete' user.id %}" class="btn btn-danger btn-sm">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No users registered.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'bookregister' %}" class="btn btn-success">Add New</a>
</div>
</body>
</html>
