{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Room Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url("{% static 'img/hotels1.jpg' %}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            position: relative;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            z-index: 0;
        }
        .form-card {
            position: relative;
            z-index: 1;
            max-width: 550px;
            width: 100%;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body style="background-image: url('{% static 'img/room12.jpg' %}'); background-size: cover; background-position: center; opacity: 0.9;">

<div class="overlay"></div>
{% include 'navuser.html' %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="form-card">
        <h3 class="text-center">Room Booking</h3>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="{% url 'register_room' %}" id="booking-form">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="first_name" value="{{ form_data.first_name|default:'' }}" class="form-control" placeholder="First Name" required>
            </div>
            <div class="mb-3">
                <input type="text" name="last_name" value="{{ form_data.last_name|default:'' }}" class="form-control" placeholder="Last Name" required>
            </div>
            <div class="mb-3">
                <input type="email" name="email" value="{{ form_data.email|default:'' }}" class="form-control" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <input type="tel" name="mobile_number" value="{{ form_data.mobile_number|default:'' }}" class="form-control" placeholder="Mobile Number" pattern="[0-9]{10,15}" required>
            </div>
            <div class="mb-3">
                <label>Check-In</label>
                <input type="date" name="check_in" id="check-in" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Check-Out</label>
                <input type="date" name="check_out" id="check-out" class="form-control" required>
            </div>

            <div class="mb-3">
                <select name="room_type" class="form-select" required>
                    <option value="">Select Room Type</option>
                    <option value="Single">Single Bed</option>
                    <option value="Double">Double Bed</option>
                </select>
            </div>
            <div class="mb-3">
                <select name="category" class="form-select" required>
                    <option value="">Select Category</option>
                    <option value="AC">A/C</option>
                    <option value="Non-AC">Non A/C</option>
                </select>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-dark">Submit</button>
            </div>
        </form>
        <div class="text-center mt-3">
        </div>
    </div>
</div>

<script>
const checkIn = document.getElementById('check-in');
const checkOut = document.getElementById('check-out');
const today = new Date().toISOString().split('T')[0];
checkIn.min = today;
function updateCheckoutMin() { checkOut.min = checkIn.value || today; }
checkIn.addEventListener('change', updateCheckoutMin);
updateCheckoutMin();
</script>

</body>
</html>
