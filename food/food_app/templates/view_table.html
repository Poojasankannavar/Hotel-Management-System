{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Hotel Template">
    <meta name="keywords" content="Hotel, Table Management, HTML, Bootstrap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel - Table Item List</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Taviraj:300,400,500,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,800&display=swap" rel="stylesheet">

    <!-- CSS Styles -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">

    <style>
        body {
            padding-top: 100px;
            background-color: #f8f9fa;
        }

        .header-section {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .main-menu li:hover .drop-menu {
            display: block;
        }

        .container {
            margin-top: 50px;
        }

        .table th,
        .table td {
            vertical-align: middle;
        }

        .btn {
            width: 80px;
        }
    </style>
</head>

<body>

    {% include 'nav.html' %}

    <div class="container">
        <h3 class="text-center mb-4">Table Item List</h3>
        <table class="table table-bordered table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>Table Name</th>
                    <th>Category</th>
                    <th colspan="2" class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for u in udata %}
                <tr>
                    <td>{{ u.Table_name }}</td>
                    <td>{{ u.Category }}</td>
                    <td class="text-center">
                        <a href="{% url 'edit_table' u.id %}" class="btn btn-primary btn-sm">Edit</a>
                    </td>
                    <td class="text-center">
                        <a href="{% url 'delete_table_record' u.id %}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No table items found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- JS Plugins -->
    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/jquery-ui.min.js' %}"></script>
    <script src="{% static 'js/jquery.nice-select.min.js' %}"></script>
    <script src="{% static 'js/jquery.slicknav.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
