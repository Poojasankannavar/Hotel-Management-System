{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Hotel Management System">
    <meta name="keywords" content="Hotel, Table Booking, AC, Non-AC">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel - Add Table Item</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Taviraj:300,400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,800&display=swap" rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" type="text/css">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f8f9fa;
            padding-top: 100px;
        }

        .header-section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-success {
            width: 100%;
        }

        .message {
            color: red;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    {% include 'nav.html' %}

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-container">
                    <p class="form-title">Add Table Item</p>
                    <form method="post">
                        {% csrf_token %}
                        {% if msg %}
                        <p class="message">{{ msg }}</p>
                        {% endif %}
                        <div class="mb-3">
                            <label for="tableName" class="form-label">Table Name</label>
                            <input type="text" id="tableName" name="t1" required class="form-control" placeholder="Enter table name">
                        </div>
                        <div class="mb-3">
                            <label for="itemType" class="form-label">Item Name</label>
                            <select id="itemType" name="t2" class="form-select">
                                <option value="A/C">A/C</option>
                                <option value="Non A/C">Non A/C</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Add Item</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Plugins -->
    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>

</body>

</html>
