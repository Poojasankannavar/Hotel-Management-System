{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Hotel Company Form">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Company | Hotel</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Taviraj:400,600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600&display=swap" rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f9f9f9;
            padding-top: 100px;
        }

        .form-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            margin: auto;
        }

        h3 {
            font-family: 'Taviraj', serif;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            font-weight: 500;
        }

        .btn-success {
            width: 100%;
        }
    </style>
</head>

<body>
    {% include 'nav.html' %}

    <div class="container">
        <div class="form-container">
            <h3>Add Company</h3>

            {% if msg %}
                <div class="alert alert-info text-center">{{ msg }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="t1" required class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Company Address</label>
                        <input type="text" name="t2" required class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Company GST</label>
                        <input type="text" name="t3" required class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Company Mobile Number</label>
                        <input type="text" name="t4" required class="form-control">
                    </div>

                    <div class="col-12 mt-3">
                        <button type="submit" class="btn btn-success">Add Company</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- JS Files -->
    <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
