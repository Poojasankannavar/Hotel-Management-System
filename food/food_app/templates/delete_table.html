{% load static %}
<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Hotel Template">
    <meta name="keywords" content="Hotel, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hotel</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Taviraj:300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800&display=swap" rel="stylesheet">

    <!-- CSS Styles -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/flaticon.css' %}">
    <link rel="stylesheet" href="{% static 'css/linearicons.css' %}">
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/jquery-ui.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/nice-select.css' %}">
    <link rel="stylesheet" href="{% static 'css/magnific-popup.css' %}">
    <link rel="stylesheet" href="{% static 'css/slicknav.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .card-clickable {
            cursor: pointer;
            background-color: #dc3545 !important; /* Red for stored */
            color: white !important;
            box-shadow: 0 8px 16px rgba(220, 53, 69, 0.5);
            transform: scale(1.05);
        }
        .card-clickable:hover {
            transform: scale(1.02);
        }
        .header-section {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .main-menu li:hover .drop-menu {
            display: block;
        }
    </style>
</head>

<body>
{% include 'nav.html' %}

    <br/><br/><br/><br/><br/>

    <div class="container mt-4">
        <h2>Delete Table</h2>
        <div class="row mt-4">
            {% for table in tableName %}
            <div class="col-md-4 mb-4">
                <div class="card card-clickable
                    {% if table.table_name == saved_table_name %}bg-blue
                    {% elif table.table_name in stored_tables %}bg-yellow
                    {% endif %}">
                    <div class="card-body">
                        <h5 class="card-title"><strong>{{ table.table_name }}</strong></h5>
                        <button type="button" class="btn btn-danger" onclick="deleteTable('{{ table.table_name|escapejs }}')">Delete</button>

                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- jQuery (must come before script using it) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- AJAX Script -->
    <script>
        function deleteTable(table_name) {
            if (confirm('Are you sure you want to delete this table?')) {
                $.ajax({
                    url: '{% url "delete_table" %}',
                    method: 'POST',
                    data: {
                        'table_name': table_name,
                        'csrfmiddlewaretoken': '{{ csrf_token }}',
                    },
                    success: function(response) {
                        if (response.success) {
                            alert('Table deleted successfully!');
                            window.location.reload();  // or redirect if preferred
                        } else {
                            alert('Error: ' + response.error);
                        }
                    },
                    error: function() {
                        alert('Failed to delete table. Please try again.');
                    }
                });
            }
        }
    </script>

    <!-- Bootstrap & Plugin JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'js/jquery-ui.min.js' %}"></script>
    <script src="{% static 'js/jquery.nice-select.min.js' %}"></script>
    <script src="{% static 'js/jquery.slicknav.js' %}"></script>
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
